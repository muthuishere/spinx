location: "East US"
serviceName: "todo-mcp-server"
dockerfilePath: "../Dockerfile"
environmentFile: "../.env"
containerPort: 8080
cpu: "0.25"
memory: "0.5Gi"
minReplicas: 0
maxReplicas: 1
healthCheckPath: "/api/health"
healthCheckIntervalSeconds: 30
deploymentTimeoutMinutes: 10

# Optional: path to a secrets file (relative or absolute).
# Values are NEVER logged. Add this file to .gitignore!
# Format: KEY=value (same as .env). Suggested names:
#   .env.secrets, .env.secrets.dev, .env.secrets.prod
# secretsFile: ".env.secrets.prod"
