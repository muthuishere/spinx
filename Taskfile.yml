version: '3'

dotenv: ['.env']

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  create-npm-library:
    desc: Create the jar library for npm package
    cmds:
      - ./gradlew createNpmLib

  npm-spinx:
    desc: Run spinx command with arguments (use -- to pass args)
    cmds:
      - node npm/bin/spinx {{.CLI_ARGS}}

  local-install:
    desc: Build jar library and install spinx for current user from the npm package (no sudo required)
    deps: [create-npm-library]
    dir: npm
    cmds:
      - mkdir -p ${HOME}/.npm-global
      - npm install -g . --prefix ${HOME}/.npm-global
      - echo "Done! To use spinx, add the following to your shell profile (~/.bashrc or ~/.zshrc):"
      - echo "  export PATH=\"\$HOME/.npm-global/bin:\$PATH\""
 