version: '3'

dotenv: ['.env']

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  create-npm-library:
    desc: Create the jar library for npm package
    cmds:
      - ./gradlew createNpmLib

  npm-spinx:
    desc: Run spinx command with arguments (use -- to pass args)
    cmds:
      - node npm/bin/spinx {{.CLI_ARGS}}

  local-install:
    desc: Build fat JAR and create dist/ with launcher scripts – then add dist/ to your PATH (no admin required)
    cmds:
      - ./gradlew createLocalDist
 